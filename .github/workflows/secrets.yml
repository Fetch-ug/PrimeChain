name: secrets

# Cheap, dependency-free credential scan on every push. This is a coarse net,
# not a substitute for gitleaks/trufflehog; Phase 6 adds those, pinned.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: no credentials in tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan
        run: python3 scripts/scan_secrets.py
